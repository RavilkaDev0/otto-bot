services:
  postgres:
    image: postgres:16-alpine
    container_name: otto-bot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: otto-bot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: otto-bot-mongodb
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: otto-bot-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    env_file:
      - docker.env
    
    volumes: 
      - rabbitmq-data:/var/lib/rabbitmq
    
    ports:
      - "127.0.0.1:15670:15672"

    expose:
      - "5672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otto-bit-rabbitmq-worker
    command: ["python", "-m", "app.infrastructure.rabbitmq_worker"]
    env_file:
      - docker.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otto-bot-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - docker.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: otto_bot
      ARQ_REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: arq:otto-bot
      FRONTEND_APP_URL: https://okb.automatonsoft.de
      OPENAI_ATTRIBUTE_FILL_API_KEYS: ${OPENAI_ATTRIBUTE_FILL_API_KEYS:-}
      UPLOADS_DIR: /app/uploads
      GENERATED_MEDIA_ROOT: /app/storage/generated
      GENERATED_MEDIA_URL_PREFIX: /generated-media
    volumes:
      - ./storage/uploads:/app/uploads
      - ./storage/generated:/app/storage/generated
      - ./logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otto-bot-worker
    command: ["arq", "app.tasks.WorkerSettings"]
    env_file:
      - docker.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: otto_bot
      ARQ_REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: arq:otto-bot
      ARQ_WORKER_CONCURRENCY: ${ARQ_WORKER_CONCURRENCY:-2}
      FRONTEND_APP_URL: https://okb.automatonsoft.de
      OPENAI_ATTRIBUTE_FILL_API_KEYS: ${OPENAI_ATTRIBUTE_FILL_API_KEYS:-}
      GENERATED_MEDIA_ROOT: /app/storage/generated
      GENERATED_MEDIA_URL_PREFIX: /generated-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./storage/generated:/app/storage/generated
      - ./logs:/app/logs
      - ./temp:/app/temp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_FRONTEND_PROJECT:-otto-bot-frontend}
    container_name: otto-bot-frontend
    env_file:
      - docker.env
    environment:
      BACKEND_BASE_URL: http://backend:8000
      COOKIE_SECURE: "true"
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      SENTRY_PROJECT: ${SENTRY_FRONTEND_PROJECT:-otto-bot-frontend}
      UPLOADS_DIR: /app/uploads 
    volumes:
      - ./storage/uploads:/app/uploads
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: otto-bot-nginx
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/uploads:/var/www/uploads:ro
      - ./storage/generated:/var/www/generated-media:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  rabbitmq-data:
